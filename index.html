<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Raumplaner" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Raumplaner</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='6' fill='%232f7cf6'/%3E%3Cpath d='M9 22V10h14v12' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <button id="btnLeft" class="icon panel-toggle" title="Seitenleiste: Raum, Möbel, Oberflächen, Sonne" aria-pressed="true">
        <svg viewBox="0 0 20 20" width="18" height="18"><rect x="2" y="3" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="2" y="3" width="6" height="14" rx="1.5" fill="currentColor"/></svg>
      </button>
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 32 32"><rect x="3" y="3" width="26" height="26" rx="6" fill="currentColor" /><path d="M9 22V10h14v12" fill="none" stroke="white" stroke-width="3" /></svg>
        <span>Raumplaner</span>
      </div>
      <input id="projectName" class="project-name" title="Projektname" />
      <div class="group">
        <button id="btnUndo" class="icon" title="Rückgängig (Strg+Z)">↶</button>
        <button id="btnRedo" class="icon" title="Wiederholen (Strg+Y)">↷</button>
      </div>
      <div class="seg" id="viewSeg">
        <button data-view="2d">2D-Plan</button>
        <button data-view="split" class="active">Geteilt</button>
        <button data-view="3d">3D</button>
      </div>
      <div class="spacer"></div>
      <button id="btnInstall" class="primary" hidden title="Raumplaner als App installieren">App installieren</button>
      <span id="offlineBadge" class="badge" hidden>Offline</span>
      <div class="group files">
        <button id="btnNew" title="Neues, leeres Projekt">Neu</button>
        <button id="btnOpen" title="Projektdatei (.json) öffnen">Öffnen</button>
        <button id="btnSave" title="Projekt als Datei speichern">Speichern</button>
        <button id="btnShot" title="Bild der aktuellen Ansicht speichern">Bild</button>
      </div>
      <button id="btnMenu" class="icon menu-btn" title="Datei-Menü">⋯</button>
      <button id="btnHelp" class="icon" title="Hilfe">?</button>
      <button id="btnRight" class="icon panel-toggle" title="Eigenschaften der Auswahl" aria-pressed="true">
        <svg viewBox="0 0 20 20" width="18" height="18"><rect x="2" y="3" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="12" y="3" width="6" height="14" rx="1.5" fill="currentColor"/></svg>
      </button>
      <input type="file" id="fileInput" accept=".json,application/json" hidden />
    </header>

    <div class="main" id="main">
      <aside class="sidebar">
        <nav class="tabs" id="tabs">
          <button data-tab="raum" class="active">Raum</button>
          <button data-tab="moebel">Möbel</button>
          <button data-tab="technik">Technik</button>
          <button data-tab="material">Material</button>
          <button data-tab="sonne">Sonne</button>
        </nav>
        <div class="tabpanels">
          <section class="tabpanel active" id="tab-raum"></section>
          <section class="tabpanel" id="tab-moebel"></section>
          <section class="tabpanel" id="tab-technik"></section>
          <section class="tabpanel" id="tab-material"></section>
          <section class="tabpanel" id="tab-sonne"></section>
        </div>
      </aside>

      <section class="views split" id="views">
        <div class="pane pane2d" id="pane2d">
          <div class="toolbar" id="toolbar2d"></div>
          <div class="canvas-host" id="plan"></div>
          <div class="touchbar" id="wallbar" hidden></div>
          <div class="touchbar selbar" id="selbar" hidden></div>
          <div class="touchbar" id="placebar" hidden></div>
        </div>
        <div class="pane pane3d" id="pane3d">
          <div class="toolbar" id="toolbar3d"></div>
          <div class="canvas-host" id="view3d">
            <div class="joystick" id="joystick" hidden><div class="knob"></div></div>
          </div>
          <div class="timebar" id="timebar"></div>
        </div>
      </section>

      <aside class="props" id="props"></aside>
    </div>
    <footer class="status"><span id="status">Willkommen!</span><span id="statusRight"></span></footer>

    <div class="modal-back" id="modalBack" hidden>
      <div class="modal" id="modal"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
